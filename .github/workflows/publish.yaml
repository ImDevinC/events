name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  publish:
    permissions:
      packages: write
      contents: read
    uses: imdevinc/imdevinc/.github/workflows/shared-publish-docker.yaml@v1

  image-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

  update-homelab:
    needs: [publish, image-tag]
    uses: ImDevinC/homelab/.github/workflows/update-image.yaml@main
    with:
      chart: events
      imageName: ghcr.io/imdevinc/events
      newTag: ${{ needs.image-tag.outputs.tag }}
    secrets:
      HOMELAB_TOKEN: ${{ secrets.HOMELAB_TOKEN }}
